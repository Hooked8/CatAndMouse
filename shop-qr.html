<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ACHILLES shop QR</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    img {
      width: min(72vw, 360px);
      height: auto;
      background: #fff;
      padding: 1rem;
      border-radius: 12px;
    }
    a.btn {
      display: inline-block;
      background: #f3f3f3;
      color: #111;
      text-decoration: none;
      font-weight: 700;
      padding: 0.85rem 1.2rem;
      border-radius: 999px;
      margin: 0.35rem;
    }
    a.link { color: #fff; }
    p { opacity: 0.8; max-width: 32ch; margin: 1rem auto; }
  </style>
</head>
<body>
  <div>
    <h1 style="letter-spacing: 0.2em; font-weight: 600; font-size: 1rem">ACHILLES</h1>
    <img
      src="/images/brand/achilles-shopify-qr-print.png"
      alt="QR code to ACHILLES Shopify store"
    />
    <p>
      Scans to the permanent shop:<br />
      <a class="link" href="https://cjz63c-nh.myshopify.com">cjz63c-nh.myshopify.com</a>
    </p>
    <p>
      <a class="btn" href="/images/brand/achilles-shopify-qr-print.png" download="achilles-shopify-qr.png"
        >Download QR image</a
      >
      <a class="btn" href="/shopify/achilles-shopify-qr.stl" download="achilles-shopify-qr.stl"
        >Download 3D print STL</a
      >
    </p>
    <p style="font-size: 0.85rem">
      STL is ~66×66×3.2 mm. Print base in white/light filament and raised modules in black (or paint the raised squares black) so phones can scan it.
    </p>
  </div>
</body>
</html>
