<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ACHILLES spray stencil</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    img {
      width: min(78vw, 420px);
      height: auto;
      background: #fff;
      padding: 0.75rem;
      border-radius: 12px;
    }
    a.btn {
      display: inline-block;
      background: #f3f3f3;
      color: #111;
      text-decoration: none;
      font-weight: 700;
      padding: 0.85rem 1.2rem;
      border-radius: 999px;
      margin: 0.35rem;
    }
    a.link { color: #fff; }
    p { opacity: 0.85; max-width: 36ch; margin: 0.85rem auto; line-height: 1.4; }
  </style>
</head>
<body>
  <div>
    <h1 style="letter-spacing: 0.2em; font-weight: 600; font-size: 1rem">ACHILLES</h1>
    <img
      src="/shopify/achilles-spray-stencil-preview.png"
      alt="ACHILLES spray stencil preview with crest and bridged QR"
    />
    <p>
      Bridged spray stencil (crest + QR).<br />
      Scans to
      <a class="link" href="https://cjz63c-nh.myshopify.com">cjz63c-nh.myshopify.com</a>
    </p>
    <p>
      <a class="btn" href="/shopify/achilles-spray-stencil.svg" download="achilles-spray-stencil.svg"
        >Download SVG (laser / cut)</a
      >
      <a class="btn" href="/shopify/achilles-spray-stencil.stl" download="achilles-spray-stencil.stl"
        >Download STL (3D print)</a
      >
    </p>
    <p style="font-size: 0.85rem">
      ~135×218×1 mm sheet. Black = cut/holes (paint passes). Thin bridges keep every piece attached. Use dark paint on a light surface.
    </p>
  </div>

</html>
